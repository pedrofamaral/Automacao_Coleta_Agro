name: Coleta diária

on:
  schedule:
    # 22:00 UTC = 19:00 em Brasília, depois da publicação diária do CEPEA
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      comando:
        description: "run = incremental; backfill = histórico completo"
        type: choice
        options: [run, backfill]
        default: run

# nunca duas coletas ao mesmo tempo no mesmo banco
concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install .

      - name: Sincronizar schema e catálogo
        run: python -m agro_pipeline init-db

      - name: Coletar
        run: python -m agro_pipeline ${{ inputs.comando || 'run' }}
