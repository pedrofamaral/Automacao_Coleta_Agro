[project]
name = "agro-pipeline"
version = "0.1.0"
description = "Pipeline automatizado de coleta e estruturação de dados públicos do agronegócio brasileiro"
requires-python = ">=3.11"
dependencies = [
    "agrobr==1.1.0",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "xlrd>=2.0",
    "holidays>=0.60",
    "python-dotenv>=1.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter"]
ml = ["scikit-learn>=1.5", "xgboost>=2.1", "matplotlib>=3.9"]
painel = ["streamlit>=1.40", "plotly>=5.24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agro_pipeline = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
